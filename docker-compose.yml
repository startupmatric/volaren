services:

  backend:

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg2://volaren:volaren@postgres:5432/volaren

    depends_on:
      - postgres


  postgres:

    image: postgres:16

    environment:
      POSTGRES_DB: volaren
      POSTGRES_USER: volaren
      POSTGRES_PASSWORD: volaren

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: